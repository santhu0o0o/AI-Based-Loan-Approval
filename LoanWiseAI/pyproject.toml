[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loanwise"
dynamic = ["version"]
description = "LoanWise AI: plain-English loan-approval estimates (Flask API + scikit-learn model)."
requires-python = ">=3.10"
license = { text = "Proprietary" }
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]
# Keep in sync with requirements.txt (which additionally pins gunicorn for deployment).
dependencies = [
    "flask>=3.1,<3.2",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn==1.9.1",  # exact: the saved model is a pickle of this version's classes
    "joblib>=1.4,<2",
    "matplotlib>=3.8,<4",   # EDA charts during training
]

[project.optional-dependencies]
server = ["gunicorn>=23,<24"]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[project.scripts]
loanwise-train = "loanwise.ml.train:main"
loanwise-serve = "loanwise.api.dev_server:main"

[tool.setuptools.dynamic]
version = { attr = "loanwise.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------------- pytest --
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

# ------------------------------------------------------------------------------- ruff --
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "C4",            # comprehensions
    "RUF",           # ruff-specific
    "S",             # bandit (security)
    "T20",           # no print in library code
    "D",             # docstrings
    "ANN",           # type annotations
    "PTH",           # prefer pathlib
    "N",             # naming
]
ignore = [
    "D203", "D213",  # conflicting docstring layout rules
    "D105", "D107",  # magic methods / __init__ are documented by their class
    "N803", "N806",  # X / X_train: scikit-learn naming convention
    "ANN401",        # Any is deliberate for untyped JSON payloads and sklearn objects
    "RUF001",        # ₹ and other non-ASCII characters are intentional in messages
    "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "D", "ANN", "N802"]
"src/loanwise/ml/train.py" = ["T201"]
"src/loanwise/ml/sanity.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["loanwise", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ------------------------------------------------------------------------------- mypy --
[tool.mypy]
mypy_path = "src"
packages = ["loanwise"]
strict = true
warn_unreachable = true
disallow_any_generics = false   # pandas / numpy generics are noisy without stubs

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "pandas.*", "matplotlib.*"]
ignore_missing_imports = true
