# Render Blueprint: one-click deploy of LoanWise AI on Render's free plan.
# Docs: https://render.com/docs/blueprint-spec
#
# Render builds the Dockerfile on every deploy:
#   stage 1 (Node) builds the React frontend from source,
#   stage 2 (Python) installs the API and serves the app with gunicorn on $PORT.
#
# Free-plan notes:
#   - The service sleeps after 15 minutes without traffic; the next visit takes ~1 minute to wake.
#   - The disk is ephemeral, so prediction history (SQLite) resets on restart, sleep or redeploy.
services:
  - type: web
    name: loanwise-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LOANWISE_LOG_LEVEL
        value: INFO